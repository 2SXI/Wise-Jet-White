<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reset password · SXI Digital</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#06070a">
<link rel="icon" href="favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal/portal.css">
</head>
<body>
<main class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><img src="logo-sm.png" alt="" width="30" height="30"><span>SXI Digital</span></div>
    <h1>Set a new password</h1>
    <p class="sub" id="sub">Choose a password you don't use anywhere else.</p>
    <form id="reset-form" class="form" novalidate hidden>
      <div class="field"><label for="pw">New password</label>
        <input class="input" id="pw" type="password" autocomplete="new-password" minlength="10" required>
        <span class="hint">At least 10 characters.</span></div>
      <div class="field"><label for="pw2">Confirm password</label>
        <input class="input" id="pw2" type="password" autocomplete="new-password" required></div>
      <div id="msg" aria-live="polite"></div>
      <button class="btn btn-primary btn-lg" id="submit" type="submit">Update password</button>
    </form>
    <div id="invalid" hidden><p class="alert warn">This reset link has expired or was already used.</p><p class="auth-foot"><a class="link" href="login.html">Back to sign in</a></p></div>
  </div>
</main>
<script src="portal/js/vendor/supabase.js"></script>
<script type="module" src="portal/js/reset.js"></script>
</body>
</html>
