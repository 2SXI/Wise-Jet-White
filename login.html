<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · SXI Digital</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#06070a">
<link rel="icon" href="favicon-32x32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal/portal.css">
</head>
<body>
<main class="auth-wrap">
  <div class="auth-card">
    <div class="brand"><img src="logo-sm.png" alt="" width="30" height="30"><span>SXI Digital</span></div>
    <h1>Sign in</h1>
    <p class="sub">Access your websites, domains, email and invoices.</p>

    <form id="login-form" class="form" novalidate>
      <div class="field"><label for="email">Email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required placeholder="you@company.co.zw"></div>
      <div class="field"><label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
      <div class="auth-links"><span></span><a class="link" href="#" id="forgot">Forgot password?</a></div>
      <div id="msg" aria-live="polite"></div>
      <button class="btn btn-primary btn-lg" id="submit" type="submit">Sign in</button>
    </form>
    <p class="auth-foot">Client accounts are created by SXI Digital. Need access? <a class="link" href="contact.html">Contact us</a>.</p>
  </div>
</main>
<script src="portal/js/vendor/supabase.js"></script>
<script type="module" src="portal/js/login.js"></script>
</body>
</html>
